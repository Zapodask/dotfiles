#################
### AUTOSTART ###
#################

exec-once = waybar & hyprpaper & hypridle & hyprsunset & swaync
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = nm-applet --indicator
exec-once = systemctl --user start hyprpolkitagent

exec = gsettings set org.gnome.desktop.interface gtk-theme "Dracula"
exec = gsettings set org.gnome.desktop.wm.preferences theme "Dracula"
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec = gsettings set org.gnome.desktop.interface icon-theme "Dracula"
exec-once = gsettings set org.gnome.desktop.interface cursor-theme "phinger-cursors-dark"
exec-once = hyprctl setcursor phinger-cursors-dark
